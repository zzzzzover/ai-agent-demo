[project]
name = "agent-demo"
version = "0.1.0"
description = "一个手写的工具调用型 CLI Agent：不依赖任何 Agent 框架，自带回放测试、结构化 trace 与路径沙箱。"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
agent-demo = "agent_demo.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
